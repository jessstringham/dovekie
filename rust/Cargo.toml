[package]
name = "dovekie"
version = "0.0.1"
edition = "2021"
authors = ["Jessica Stringham"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("schemars"))',
] }


[lib]
crate-type = ["cdylib"]


# default = ["schemars"]
# schemars = [
#   "murrelet_gpu/schemars",
#   "murrelet_draw/schemars",
#   "murrelet_livecode/schemars",
#   "murrelet_perform/schemars",
# ]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.42"
console_error_panic_hook = "0.1"

schemars = "0.8.21"

itertools = "0.10.5"
rand = "0.8"

serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"

murrelet = { workspace = true }
murrelet_common = { workspace = true }
murrelet_livecode = { workspace = true }
murrelet_perform = { workspace = true, features = ["for_the_web"] }
murrelet_gui = { workspace = true, features = ["glam"] }
murrelet_schema = { workspace = true, features = ["glam"] }
murrelet_gen = { workspace = true }
murrelet_draw = { workspace = true }
murrelet_wasm = { workspace = true }
lerpable = { workspace = true }

anyhow = "1.0.86"

nalgebra = "0.33.2"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  # "Window",
  # "Document",
  # "Element",
  # "HtmlCanvasElement",
  # "CanvasRenderingContext2d",
]
